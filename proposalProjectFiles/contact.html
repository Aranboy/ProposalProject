<form action="/submit" method="POST" class="contact-form">
  <div class="form-group">
    <label for="full-name">Name of sender</label>
    <input 
      type="text" 
      id="full-name" 
      required 
    />
  </div>

  <div class="form-group">
    <label for="email">Email Address of sender</label>
    <input 
      type="email" 
      id="email" 
      name="email" 
      required 
    />
  </div>

  <div class="form-group">
    <label for="message">Message from sender</label>
    <textarea
      id="message" 
      name="message"
      minlength="1" 
      required 
    ></textarea>
  </div>

  <button type="submit">Send message</button>
